# Parameters of chapter 4 of the thesis, plus three new experiments at the end.
# Kernels: {name: boolean, R: 1} | {name: exponential, beta: 3} | ...; add
# normalize: true to rescale the length so that ||g|| = 1.
# Grids: an explicit list, or {log: [from, to], num: n} for a log-spaced grid.
seed: 2026
n_jobs: -1          # replicates run in parallel on all cores

# Table 4.1
kernels:
  mu: 1.0
  tol: 1.0e-4
  kernels:
    - {name: boolean, normalize: true}
    - {name: exponential, normalize: true}
    - {name: gaussian, normalize: true}
    - {name: power_law, alpha: 4, normalize: true}

# Figure 4.5
connection_probability:
  lam: 1.0
  L: 30
  replicates: 40
  min_pairs: 500
  cases:
    - {kernel: {name: boolean, R: 1}, mu: 0.2, r_max: 2.2}
    - {kernel: {name: boolean, R: 1}, mu: 1.0, r_max: 2.2}
    - {kernel: {name: boolean, R: 1}, mu: 5.0, r_max: 2.2}
    - {kernel: {name: exponential, beta: 3}, mu: 0.5, r_max: 4.0}
    - {kernel: {name: exponential, beta: 3}, mu: 2.0, r_max: 4.0}
    - {kernel: {name: exponential, beta: 3}, mu: 10.0, r_max: 4.0}

# Table 4.2
expected_degree:
  kernel: {name: boolean, R: 1}
  L: 40
  replicates: 250
  points: [[1, 0.05], [1, 0.2], [1, 1], [1, 5], [0.5, 1], [2, 1], [3, 0.5]]

# Figure 4.6
convergence:
  kernel: {name: boolean, R: 1}
  lam: 1.5
  mu: 1.0
  L: [12, 18, 24, 30, 36, 42]
  replicates_at_max: 60

# Figure 4.7
vertex_intensity:
  kernel: {name: boolean, R: 1}
  mu: 1.0
  L: 26
  replicates: 120
  lam: {log: [0.3, 4.8], num: 9}

# Figure 4.8
decomposition:
  kernel: {name: boolean, R: 1}
  lam: 2.0
  L: 26
  replicates: 90
  mu: {log: [0.01, 10], num: 13}
  theory_mu: {log: [0.005, 20], num: 60}

# Table 4.3 and Figure 4.9
sparse_regime:
  kernel: {name: boolean, R: 1}
  lam: 2.0
  L: 30
  replicates: 140
  table_mu: [0.01, 0.02, 0.05, 0.1, 0.2, 0.5]
  theory_mu: {log: [0.001, 10], num: 60}
  fit_range: [0.002, 0.05]

# Figure 4.10 (amplitude g / sqrt(mu) at every mu)
attribute_rich:
  kernel: {name: boolean, R: 1}
  lam: 2.0
  L: 24
  replicates: 90
  heavy_mu: 300       # above this, fewer replicates: each graph has > 10^5 groups
  replicates_heavy: 30
  mu: {log: [1, 1000], num: 7}
  theory_mu: {log: [1, 10000], num: 30}

# Figure 4.11
continuum_limit:
  kernel: {name: boolean, R: 1}
  lam: 1.5
  dilations: [0.7, 1.0, 1.4, 2.0]
  L_min: 20
  L_per_r: 9
  replicates: 40
  nu: {log: [0.05, 40], num: 8}
  theory_nu: {log: [0.01, 300], num: 110}   # beyond ~300 even 128 nodes stop being accurate
  theory_nodes: 128   # Gauss-Legendre nodes; 48 is not enough for nu > 20

# Section 4.3.4: 10^7 configurations per dimension
dimensions:
  d: [1, 2, 3]
  batches: 50
  batch_size: 200000

# Figure 4.12
kernel_comparison:
  lam: 2.0
  L: 24              # the thesis used 22; at mu = 20 the exponential kernel needs L > 22.8
  replicates: 60
  kernels:
    - {name: boolean, normalize: true}
    - {name: exponential, normalize: true}
  mu: {log: [0.1, 20], num: 9}
  theory_mu: {log: [0.05, 30], num: 40}

# NEW: GRIG against the random connection model with the same p(z)
grig_vs_rcm:
  kernel: {name: boolean, R: 1}
  lam: 1.5
  L: 30
  replicates: 40
  min_vertices: 30
  mu: [0.2, 1.0, 5.0]
  theory_mu: {log: [0.01, 30], num: 40}

# NEW: d = 1, 2, 3 with ||g|| = 1
higher_dimensions:
  d: [1, 2, 3]
  lam: {1: 4.0, 2: 4.0, 3: 4.0}
  L: {1: 400, 2: 20, 3: 7.5}
  replicates: 40
  mu: {log: [0.05, 50], num: 10}

# NEW: size of the largest component
percolation:
  kernel: {name: boolean, R: 1}
  L: 40
  replicates: 30
  mu: [0.3, 1.0, 5.0]
  lam: {log: [0.05, 2.0], num: 28}
